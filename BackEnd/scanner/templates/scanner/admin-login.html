
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | CalorieScan</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f5f0ff, #ebe3ff, #ffffff);
            color: #30234a;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            padding: 42px 36px;
            background: #ffffff;
            border: 1px solid #eee6ff;
            border-radius: 24px;
            box-shadow: 0 18px 55px rgba(103, 64, 166, 0.13);
        }

        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-icon {
            width: 68px;
            height: 68px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            background: #eee5ff;
            font-size: 34px;
        }

        .brand h1 {
            color: #7041c5;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .brand p {
            color: #9185a6;
            font-size: 14px;
        }

        .admin-badge {
            display: inline-block;
            margin-top: 16px;
            padding: 7px 14px;
            border-radius: 20px;
            background: #f2ebff;
            color: #7041c5;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 9px;
            color: #493861;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #e4dced;
            border-radius: 12px;
            outline: none;
            background: #fdfcff;
            color: #30234a;
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.12);
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap input {
            padding-right: 65px;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #8058ba;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .login-button {
            width: 100%;
            margin-top: 8px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #8956df, #6e3bc0);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(112, 65, 197, 0.22);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 11px 24px rgba(112, 65, 197, 0.3);
        }

        .message {
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 10px;
            background: #fff0f0;
            color: #b42318;
            font-size: 13px;
            line-height: 1.5;
        }

        .back-link {
            display: block;
            margin-top: 24px;
            text-align: center;
            color: #8058ba;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .footer {
            margin-top: 30px;
            color: #a398b3;
            text-align: center;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 32px 24px;
            }

            .brand h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <main class="login-container">
        <header class="brand">
            <div class="brand-icon">🍇</div>
            <h1>CalorieScan</h1>
            <p>Manage your website with ease</p>
            <span class="admin-badge">ADMIN PORTAL</span>
        </header>

        {% if messages %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endif %}

        {% if error %}
            <div class="message">{{ error }}</div>
        {% endif %}

        <form method="post" action="{% url 'admin-login' %}">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Admin Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your admin username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="password-wrap">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword()"
                    >
                        SHOW
                    </button>
                </div>
            </div>

            <button type="submit" class="login-button">
                Sign In to Admin
            </button>
        </form>

        <a href="{% url 'login' %}" class="back-link">
            ← Back to User Login
        </a>

        <div class="footer">
            © 2026 CalorieScan · Admin Portal
        </div>
    </main>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById("password");
            const toggleButton = document.querySelector(".toggle-password");

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                toggleButton.textContent = "HIDE";
            } else {
                passwordInput.type = "password";
                toggleButton.textContent = "SHOW";
            }
        }
    </script>
</body>
</html>
