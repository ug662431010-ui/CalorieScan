<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalorieScan Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2efff;
            font-family: Arial, sans-serif;
        }

        .login-container {
            width: 90%;
            max-width: 400px;
            padding: 35px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #6c4bd3;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #8062df;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #6c4bd3;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #5636b5;
        }

        .error {
            padding: 10px;
            background: #ffeaea;
            color: #c62828;
            border-radius: 8px;
            font-size: 14px;
        }

        .links {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }

        a {
            color: #6c4bd3;
            text-decoration: none;
        }

        .signup {
            margin-top: 12px;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <h1>CalorieScan</h1>
        <p class="subtitle">Sign in to your account</p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">Login</button>
        </form>

        <div class="links">
            <p><a href="/forgot-password/">Forgot Password?</a></p>

            <p class="signup">
                Don't have an account?
                <a href="/signup/">Sign Up</a>
            </p>
        </div>
    </div>
</body>
</html>
