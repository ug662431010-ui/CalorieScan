
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | CalorieScan</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f5f9;
            color: #252542;
        }

        header {
            background: #4936a5;
            color: white;
            padding: 20px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        main {
            max-width: 1000px;
            margin: 40px auto;
            padding: 24px;
        }

        .card {
            background: white;
            padding: 28px;
            border-radius: 14px;
            box-shadow: 0 4px 16px #00000010;
        }

        h1 {
            margin-top: 0;
        }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            background: #e9e4ff;
            color: #4936a5;
            border-radius: 20px;
            font-size: 14px;
        }

        a {
            color: #4936a5;
        }
    </style>
</head>
<body>
    <header>
        <strong>CalorieScan Admin</strong>
        <span>Administrator</span>
    </header>

    <main>
        <section class="card">
            <span class="badge">Admin Dashboard</span>
            <h1>Welcome, Administrator!</h1>
            <p>You are logged in to the CalorieScan administration area.</p>
            <p>This dashboard is a starting point for future admin features.</p>
            <a href="/dashboard/">Go to User Dashboard</a>
        </section>
    </main>
</body>
</html>
