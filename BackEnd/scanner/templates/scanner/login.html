<!DOCTYPE html>
<html lang="en">

<head>
    {% load static %}

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - CalorieScan</title>

    <link rel="stylesheet" href="{% static 'scanner/css/style.css' %}">

</head>

<body>

<div class="login-container">

    <div class="login-box">

        <h1>Welcome Back!</h1>

        <p>Login to continue</p>


        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >


            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >


            <div class="login-option">

                <label>

                    <input
                        type="checkbox"
                        id="rememberMe"
                    >

                    Remember me

                </label>


                <a href="#">
                    Forgot password?
                </a>

            </div>


            <button type="submit">
                Login
            </button>

        </form>


        <p class="or">
            Or continue with
        </p>


        <div class="social-login">

            <button type="button">
                Google
            </button>

            <button type="button">
                Facebook
            </button>

            <button type="button">
                Apple
            </button>

        </div>


        <p class="signup-link">

            Don't have an account?

            <a href="/signup/">
                Sign Up
            </a>

        </p>

    </div>

</div>


<script>

const loginForm = document.getElementById("loginForm");

loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;

    try {

        const response = await fetch(
            "/api/login/",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

            credentials: "include",

                body: JSON.stringify({
                    email: email,
                    password: password
                })
            }
        );

        const data = await response.json();

        console.log("LOGIN RESULT:", data);

        if (data.success) {

            console.log("🚀 GOING TO DASHBOARD!");

            localStorage.setItem(
                "calorieScanUserName_" + email,
                 data.username
         );

            localStorage.setItem(
               "calorieScanUserEmail",
                email
         );
            localStorage.setItem("calorieScanCurrentUser", JSON.stringify({email: email, name: data.username}));
            window.location.href = "/dashboard/";

        } else {

            alert(data.message);

        }

    } catch (error) {

        console.error("LOGIN ERROR:", error);

        alert("Cannot connect to Django server.");

    }

});

</script>

</body>

</html>
