<!DOCTYPE html>
<html lang="en">

<head>
    {% load static %}

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile Setup - CalorieScan</title>

    <link rel="stylesheet" href="{% static 'scanner/css/profile-setup.css' %}">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

</head>


<body>

<div class="profile-page">

    <div class="profile-card">

        <div class="logo">
            🌙 CalorieScan
        </div>


        <h1>Tell Us About You 💜</h1>

        <p class="subtitle">
            This information helps us personalize your calorie goal.
        </p>


        <form id="profileForm">


            <!-- Name -->

            <div class="form-group">

                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <!-- Age -->

            <div class="form-group">

                <label for="age">
                    Age
                </label>

                <input
                    type="number"
                    id="age"
                    placeholder="Enter your age"
                    min="1"
                    max="120"
                    required
                >

            </div>


            <!-- Gender -->

            <div class="form-group">

                <label for="gender">
                    Gender
                </label>

                <select id="gender" required>

                    <option value="">
                        Select gender
                    </option>

                    <option value="female">
                        Female
                    </option>

                    <option value="male">
                        Male
                    </option>

                </select>

            </div>


            <!-- Weight -->

            <div class="form-group">

                <label for="weight">
                    Weight (kg)
                </label>

                <input
                    type="number"
                    id="weight"
                    placeholder="e.g. 55"
                    min="1"
                    max="500"
                    step="0.1"
                    required
                >

            </div>


            <!-- Height -->

            <div class="form-group">

                <label for="height">
                    Height (cm)
                </label>

                <input
                    type="number"
                    id="height"
                    placeholder="e.g. 165"
                    min="50"
                    max="250"
                    step="0.1"
                    required
                >

            </div>


            <!-- Goal -->

            <div class="form-group">

                <label for="goal">
                    Your Goal
                </label>

                <select id="goal" required>

                    <option value="">
                        Select your goal
                    </option>

                    <option value="lose">
                        Lose Weight
                    </option>

                    <option value="maintain">
                        Maintain Weight
                    </option>

                    <option value="gain">
                        Gain Weight
                    </option>

                </select>

            </div>


            <!-- Button -->

            <button
                type="submit"
                class="continue-btn"
            >
                Continue →
            </button>


        </form>

    </div>

</div>


<script>

const profileForm =
    document.getElementById("profileForm");


profileForm.addEventListener("submit", function(event) {

    event.preventDefault();


    const profile = {

        name:
            document.getElementById("name").value,

        age:
            document.getElementById("age").value,

        gender:
            document.getElementById("gender").value,

        weight:
            document.getElementById("weight").value,

        height:
            document.getElementById("height").value,

        goal:
            document.getElementById("goal").value

    };


    // Save temporarily

    localStorage.setItem(
        "calorieScanProfile",
        JSON.stringify(profile)
    );


    // Go Dashboard

    window.location.href =
        "/dashboard/";

});

</script>


</body>
</html>
